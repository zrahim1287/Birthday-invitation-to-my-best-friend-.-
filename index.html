<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Date Invitation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", Arial, sans-serif;

        /* Elephant wallpaper */
        background-image: url("elephant.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;

        color: #ffffff;
    }

    .main-content {
        background: rgba(0, 0, 0, 0.45);
        padding: 2rem;
        border-radius: 18px;
        max-width: 900px;
        margin: 2rem auto;
    }

    h1, h2 {
        text-align: center;
        letter-spacing: 1px;
    }

    h1 {
        font-size: 3rem;
        color: #ffe8a3;
        text-shadow: 0 0 12px rgba(0, 0, 0, 0.7);
    }

    h2 {
        color: #ffd1f3;
    }

    p {
        line-height: 1.6;
        font-size: 1.1rem;
    }

    .button-primary {
        display: inline-block;
        padding: 0.8rem 1.6rem;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #ff9a9e, #fecfef);
        color: #3b1b3b;
        font-weight: 600;
        text-decoration: none;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.25);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        margin-top: 1rem;
    }

    .button-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.35);
    }

    #music-toggle {
        margin-top: 1rem;
        padding: 0.6rem 1.2rem;
        border-radius: 10px;
        border: none;
        background: #ffe8a3;
        color: #3b1b3b;
        font-weight: bold;
        cursor: pointer;
    }

    .choice-buttons {
        text-align: center;
        margin-top: 2rem;
    }

    .choice-btn {
        padding: 0.8rem 1.6rem;
        border-radius: 12px;
        border: none;
        font-weight: bold;
        cursor: pointer;
        margin: 0.5rem;
    }

    #no-btn {
        background: #ccc;
        color: #333;
    }

    #yes-btn {
        background: #ff4f9a;
        color: white;
    }

    .menu-buttons {
        text-align: center;
        margin-top: 2rem;
    }
</style>
</head>

<body>

<!-- Background Music -->
<audio id="bg-music" src="wise-man-said.mp3" loop></audio>
<button id="music-toggle">Play music 🎵</button>

<div class="main-content">
    <h1>3rd July 2025</h1>
    <h2>Happy Birthday, My Love 💖</h2>

    <p>
        For your special day, I want to take you somewhere as beautiful as you are.  
        A night made just for us. 💕
    </p>

    <h2>The Botanist 🌿</h2>
    <p>A romantic evening · Dinner for two · Just us</p>

    <!-- YES / NO DATE QUESTION -->
    <div class="choice-buttons">
        <h2>Will you be my date? 💕💕</h2>

        <button id="no-btn" class="choice-btn">NO, THANKS</button>
        <button id="yes-btn" class="choice-btn">YES, I’D LOVE TO!</button>
    </div>

    <!-- MENU BUTTONS -->
    <div class="menu-buttons">
        <a href="https://www.mpwrestaurants.co.uk/our-brands/steakhouse-bar-and-grill/lincoln/menus" 
           class="button-primary" target="_blank">
           Steak Menu 🥩
        </a>

        <a href="https://www.mpwrestaurants.co.uk/our-brands/steakhouse-bar-and-grill/lincoln/menus" 
           class="button-primary" target="_blank">
           Dessert Menu 🍰
        </a>
    </div>

    <a href="#rsvp" class="button-primary">RSVP 💌</a>
</div>

<script>
    /* MUSIC BUTTON */
    const audio = document.getElementById("bg-music");
    const btn = document.getElementById("music-toggle");

    btn.addEventListener("click", async () => {
        try {
            if (audio.paused) {
                await audio.play();
                btn.textContent = "Pause music ⏸️";
            } else {
                audio.pause();
                btn.textContent = "Play music 🎵";
            }
        } catch (e) {
            console.log("Playback blocked:", e);
        }
    });

    /* YES / NO BUTTON LOGIC */
    document.getElementById("yes-btn").addEventListener("click", () => {
        window.location.href = "#rsvp";
    });

    document.getElementById("no-btn").addEventListener("click", () => {
        alert("Aww 😢 but I still think you're amazing!");
    });
</script>

</body>
</html>
